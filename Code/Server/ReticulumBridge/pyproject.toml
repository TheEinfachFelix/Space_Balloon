[project]
name = "reticulumbridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheEinfachFelix", email = "The.Einfach.Felix@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "influxdb-client>=1.50.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rns>=1.5.7",
]

[project.scripts]
reticulumbridge = "reticulumbridge:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
